# Hält die GitHub-Actions und das nginx-Basis-Image aktuell.
# Kein npm-Ökosystem nötig — das Projekt hat bewusst keine package.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
