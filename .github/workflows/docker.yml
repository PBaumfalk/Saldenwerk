name: Tests & Docker-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Parallel-Builds desselben Branches abbrechen — Tag-Builds (Releases) nie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node-Tests
        run: node --test tests/*.test.js

  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image für den Smoke-Test bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: saldenwerk:smoke
      - name: Smoke-Test (Startet nginx? Liefert es App und vendor aus?)
        run: |
          docker run -d --rm -p 8080:80 --name smoke saldenwerk:smoke
          sleep 2
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/app.js > /dev/null
          curl -fsS http://localhost:8080/vendor/jspdf.umd.min.js > /dev/null
          docker rm -f smoke
      - name: Bei GHCR anmelden
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags & Labels ermitteln
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pbaumfalk/saldenwerk
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Image bauen und pushen
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
