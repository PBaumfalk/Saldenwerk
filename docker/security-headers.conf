# Sicherheits-Header fuer alle Antworten.
#
# Achtung, nginx-Eigenheit: add_header vererbt NICHT additiv. Sobald ein
# location-Block ein eigenes add_header hat, verwirft er saemtliche
# add_header der server-Ebene. Diese Datei muss deshalb per include in
# den server-Block UND in jeden location-Block mit eigenem add_header.
#
# Zur CSP: die App laedt nichts von fremden Hosts; 'unsafe-inline' braucht
# nur das Theme-Bootstrap-Script im <head> von index.html und die per
# JavaScript gesetzten Style-Attribute.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
